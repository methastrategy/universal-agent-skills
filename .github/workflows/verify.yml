name: Verify Skills & Cognitive Invariants

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Invariant Verification Gate
      run: |
        node scripts/verify_invariants.cjs

    - name: Verify transcript telemetry
      run: python3 scripts/test_telemetry.py

  mt5-workflows:
    name: Verify offline MT5 workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "optuna>=4,<5"
      - run: python scripts/test_mt5_audit.py

  installers:
    name: Verify installer (${{ matrix.installer }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            installer: bash
          - os: windows-latest
            installer: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test_installers.cjs ${{ matrix.installer }}
